# Build dist/pvelab from src/ and publish it with install.sh on GitHub Pages:
#   https://seanyeh77.github.io/pvelab/install.sh   https://seanyeh77.github.io/pvelab/pvelab
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 build.py
      - run: bash -n install.sh && bash -n tests/selftest.sh
      - run: dist/pvelab help create >/dev/null
      - run: |
          mkdir _site
          cp dist/pvelab install.sh site/index.html _site/
      - uses: actions/upload-pages-artifact@v3
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
